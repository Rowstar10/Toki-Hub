name: Build Toki Hub.exe

# Every push builds Toki Hub.exe on Windows, runs the tests there, tries the exe out, and keeps it
# as a download on the run's page (the "Artifacts" section).
#
# On the default branch, a version that has no release yet (the __version__ in tokihub/__init__.py)
# is also published as a GitHub release, so every version of the hub stays downloadable. To release
# a new version, bump __version__ and push.

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements.txt

      - name: Install the build tools
        run: python -m pip install -r packaging/requirements.txt

      - name: Run the tests
        run: python -m unittest -v

      - name: Check the catalog
        run: python main.py check

      - name: Read the hub's version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import tokihub; print(tokihub.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build the exe
        run: pyinstaller --noconfirm packaging/tokihub.spec

      - name: Try out the exe
        shell: pwsh
        run: ./packaging/smoke-test.ps1 -Exe "dist/Toki Hub.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: Toki Hub
          path: dist/Toki Hub.exe
          if-no-files-found: error

      - name: Publish a release for a new version
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists. Bump __version__ in tokihub/__init__.py to publish a new one."
            exit 0
          fi
          cat > notes.md <<EOF
          Download **Toki Hub.exe** below and double-click it. Nothing to install, and no Python needed.

          Windows may say it "protected your PC", because the exe is not code-signed. Click **More info**, then **Run anyway**.
          EOF
          gh release create "v$VERSION" "dist/Toki Hub.exe#Toki Hub.exe" --target "$GITHUB_SHA" \
            --title "Toki Hub $VERSION" --notes-file notes.md --generate-notes
