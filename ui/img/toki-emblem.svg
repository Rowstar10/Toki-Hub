<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132">
  <!-- Original Toki Hub emblem: bunny ears, a halo badge and her call sign, 04.
       Shown until a picture is saved as ui/img/toki.png (see ui/img/README.md). -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f0ff"/>
      <stop offset="1" stop-color="#5cbdf4"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf1cf"/>
      <stop offset="1" stop-color="#ecd690"/>
    </linearGradient>
  </defs>
  <!-- Ears -->
  <g transform="rotate(-14 44 52)">
    <path d="M44 56 C32 34 32 6 43 4 C54 2 57 30 52 56 Z" fill="#24366a"/>
    <path d="M45 50 C38 34 38 13 44 11 C50 10 51 31 49 50 Z" fill="#9fdcff"/>
  </g>
  <g transform="rotate(16 76 52)">
    <path d="M76 56 C64 34 64 6 75 4 C86 2 89 30 84 56 Z" fill="#24366a"/>
    <path d="M77 50 C70 34 70 13 76 11 C82 10 83 31 81 50 Z" fill="#9fdcff"/>
  </g>
  <!-- Badge -->
  <circle cx="60" cy="80" r="46" fill="#ffffff"/>
  <circle cx="60" cy="80" r="41" fill="url(#badge)"/>
  <!-- A streak of pale blonde along the top, like her hair -->
  <path d="M22 70 C30 46 50 38 70 40 C86 42 96 52 99 66 C88 55 74 50 60 51 C44 52 31 59 22 70 Z" fill="url(#hair)" opacity="0.95"/>
  <!-- Halo rings -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.95">
    <circle cx="60" cy="84" r="27" stroke-width="3" stroke-dasharray="34.4 8" transform="rotate(-50 60 84)"/>
    <circle cx="60" cy="84" r="20" stroke-width="2" opacity="0.7"/>
  </g>
  <text x="60" y="95" text-anchor="middle" font-family="'Exo 2', 'Segoe UI', sans-serif" font-style="italic"
        font-weight="800" font-size="30" fill="#ffffff" letter-spacing="1">04</text>
</svg>
