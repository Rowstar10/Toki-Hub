    <circle cx="32" cy="32" r="27" stroke-width="4" stroke-dasharray="34.4 8" transform="rotate(-50 32 32)"/>
    <circle cx="32" cy="32" r="18.5" stroke-width="3.2"/>
    <circle cx="32" cy="32" r="10.5" stroke-width="2.6" stroke="#6cc8f7"/>
  </g>
  <circle cx="32" cy="32" r="3.2" fill="#f2d98d"/>
</svg>
