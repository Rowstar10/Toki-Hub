[package]
name = "toki-hub-core"
version = "0.2.0"
edition = "2021"
description = "Toki Hub's catalog, downloads, installs and game launching, without any UI."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# platform-verifier: trust the certificates Windows trusts (antivirus HTTPS scanning, company proxies).
# win-system-proxy: use the proxy set in Windows' internet settings, as other apps do.
ureq = { version = "3", features = ["platform-verifier", "win-system-proxy"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tiny_http = "0.12"
