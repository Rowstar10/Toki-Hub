[package]
name = "toki-hub"
version = "0.3.2"
edition = "2021"
description = "Toki Hub: a launcher for all of Rowstar10's games and every version of them."
publish = false

[lib]
name = "toki_hub_lib"
# a library for phones (Android loads it), and for main.rs on computers
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
toki-hub-core = { path = "../core" }
tauri = { version = "2.12", features = [] }
serde_json = "1"
include_dir = "0.7"
tauri-plugin-tokidevice = { path = "../plugins/device" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
